[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
name = "crc1415plugin"
description = "This is a schema package plugin for the CRC1415."
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ron Dockhorn", email = "ron.dockhorn@tu-dresden.de" },
]
maintainers = [
    { name = "Ron Dockhorn", email = "ron.dockhorn@tu-dresden.de" },
]
license = { file = "LICENSE" }
dependencies = [
    "nomad-lab>=1.4.0",
    "pydantic",
    "temporalio",
    "xmltodict", # Raman TVF files
]

[project.urls]
Repository = "https://github.com/Bondoki/NOMADOasisPlugin"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "structlog",
    "mkdocs",
    "mkdocs-material==9.7.7",
    "pymdown-extensions",
    "mkdocs-click",
    "pytest-asyncio",
]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4


[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # isort
    "I",
    # pylint
    "PL",
]

ignore = [
    "F403", # 'from module import *' used; unable to detect undefined names
    "PLC0415", # `import` should be at the top-level of a file
    "E501", # line too long
    "E731", # Do not assign a `lambda` expression, use a `def`
    "F841", # Local variable `numDatasetLength` is assigned to but never used
    "F401", # ... imported but unused;
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLC3002", # Lambda expression called directly. Execute the expression inline instead.

]

fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["PLC0415"] # import-outside-top-level

# this is entirely optional, you can remove this if you wish to
[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"

# indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
CRC1415SampleOverview = "crc1415plugin.schema_packages:CRC1415SampleOverview"
CRC1415MeasurementGeneric = "crc1415plugin.schema_packages:CRC1415MeasurementGeneric"
CRC1415MeasurementIR = "crc1415plugin.schema_packages:CRC1415MeasurementIR"
CRC1415MeasurementRaman = "crc1415plugin.schema_packages:CRC1415MeasurementRaman"
CRC1415MeasurementSEM = "crc1415plugin.schema_packages:CRC1415MeasurementSEM"
CRC1415MeasurementTEM = "crc1415plugin.schema_packages:CRC1415MeasurementTEM"
CRC1415MeasurementXRD = "crc1415plugin.schema_packages:CRC1415MeasurementXRD"
CRC1415MeasurementAdsorption = "crc1415plugin.schema_packages:CRC1415MeasurementAdsorption"
CRC1415MeasurementTGA = "crc1415plugin.schema_packages:CRC1415MeasurementTGA"
CRC1415MeasurementImages = "crc1415plugin.schema_packages:CRC1415MeasurementImages"
#CRC1415_A04_schema = "crc1415testsample.schema_packages:CRC1415_A04_schema"
#CRC1415Chemical = "crc1415testsample.schema_packages:CRC1415Chemical"
#action_entry_point = "crc1415plugin.actions:simple_action_entry_point"

[tool.pytest.ini_options]
testpaths = ["tests"]  # Specify the directory containing your tests
python_files = ["test_*.py", "*.py"]  # Specify the test file patterns
norecursedirs = [".git", ".svn", "__pycache__", "node_modules", "datacrc1415plugin"]

[tool.cruft]
# Avoid updating workflow files, this leads to permissions issues
skip = [".github/*"]
